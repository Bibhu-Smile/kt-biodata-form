<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Admin — Interview Biodata Submissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header no-print">
  <div class="rule-gold"></div>
  <div class="letterhead">
    <div class="crest-wrap">
      <img src="assets/logo.png" alt="School logo" id="logoImg"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'crest',textContent:'KT'}))">
    </div>
    <div class="school-block">
      <p class="eyebrow">HR Console</p>
      <h1 id="schoolName">KT Global School</h1>
      <p>Interview Biodata Submissions</p>
    </div>
  </div>
  <div class="rule-navy"></div>
</div>

<div class="wrap">

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="card no-print">
      <div class="admin-toolbar">
        <input type="text" id="searchBox" placeholder="Search by name or mobile…">
        <button id="refreshBtn">Refresh</button>
      </div>
      <p class="hint" id="loadStatus">Loading submissions…</p>
    </div>
    <ul class="sub-list" id="subList"></ul>
    <p class="empty-note" id="emptyNote" style="display:none;">No submissions found yet.</p>
  </div>

  <!-- PRINT VIEW -->
  <div id="printView" style="display:none;">
    <div class="no-print" style="margin-bottom:12px;">
      <button onclick="backToList()" style="background:#fff;border:1px solid #0f2a4a;color:#0f2a4a;padding:8px 14px;border-radius:5px;cursor:pointer;">&larr; Back to list</button>
      <button onclick="window.print()" style="background:#0f2a4a;color:#fff;border:none;padding:8px 14px;border-radius:5px;cursor:pointer;margin-left:8px;">Print / Save PDF</button>
    </div>
    <div class="print-sheet" id="printSheet"></div>
  </div>

</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
